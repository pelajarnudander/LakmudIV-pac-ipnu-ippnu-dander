<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Verifikasi Peserta LAKMUD IV</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <style>
    /* GLOBAL STYLES */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FFFFFF;
      color: #1F2937; display: flex; justify-content: center; min-height: 100vh;
    }

    /* ANIMASI LOADING */
    .loader-container {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      background-color: #FFFFFF; z-index: 50; transition: opacity 0.6s ease-out;
    }
    .abstract-spinner { width: 64px; height: 64px; position: relative; animation: spin 2s linear infinite; }
    .abstract-spinner::before, .abstract-spinner::after {
      content: ""; position: absolute; border-radius: 50%; border: 3px solid transparent;
    }
    .abstract-spinner::before {
      top: 0; left: 0; right: 0; bottom: 0; border-top-color: #059669; border-bottom-color: #059669;
      animation: spin 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
    }
    .abstract-spinner::after {
      top: 12px; left: 12px; right: 12px; bottom: 12px; border-left-color: #10B981; border-right-color: #10B981;
      animation: spinReverse 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
    }
    .loader-text {
      margin-top: 24px; font-size: 0.9rem; font-weight: 600; letter-spacing: 2px;
      color: #4B5563; text-transform: uppercase; animation: pulse 1.5s infinite; text-align: center;
    }
    .error-text { color: #B91C1C; animation: none; font-weight: 700; margin-top: 20px;}
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes spinReverse { 100% { transform: rotate(-360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    /* KARTU KONTEN */
    .app-container {
      width: 100%; max-width: 480px; padding: 40px 24px;
      opacity: 0; transform: translateY(20px); transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      display: none;
    }
    .app-container.show { opacity: 1; transform: translateY(0); display: block; }

    /* LAYOUT TENGAH & RATA KIRI */
    .top-section { text-align: center; margin-bottom: 40px; }
    .foto-peserta {
      width: 150px; height: 200px; object-fit: cover; object-position: top;
      border-radius: 20px; box-shadow: 0 15px 35px -5px rgba(0,0,0,0.15); margin: 0 auto 16px; display: block; background-color: #F3F4F6;
    }
    .no-reg {
      display: inline-block; background-color: #111827; color: #FFFFFF; font-size: 0.8rem; font-weight: 700; padding: 8px 20px; border-radius: 50px; letter-spacing: 1px;
    }
    .profile-section { text-align: left; margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid #E5E7EB; }
    .nama-peserta { font-size: 1.8rem; font-weight: 800; color: #111827; line-height: 1.2; margin-bottom: 6px; }
    .delegasi { font-size: 1rem; font-weight: 600; color: #059669; }

    /* GRID BERKAS 2 KOLOM */
    .berkas-section-title { font-size: 0.8rem; font-weight: 700; color: #6B7280; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }
    .berkas-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .berkas-item {
      padding: 12px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; display: flex; align-items: center; gap: 8px; border: 1px solid transparent;
    }
    .status-ok { background-color: #ECFDF5; color: #047857; border-color: #A7F3D0; }
    .status-no { background-color: #FEF2F2; color: #B91C1C; border-color: #FECACA; }
    .icon { width: 16px; height: 16px; flex-shrink: 0; }
  </style>
</head>
<body>

  <!-- LAYER LOADING & ERROR -->
  <div id="loader" class="loader-container">
    <div id="spinner" class="abstract-spinner"></div>
    <div id="loadingText" class="loader-text">Memverifikasi Data...</div>
  </div>

  <!-- LAYER KONTEN UTAMA -->
  <div id="app" class="app-container">
    <div class="top-section">
      <img id="imgFoto" src="" alt="Foto Peserta" class="foto-peserta">
      <div id="txtNoReg" class="no-reg">-</div>
    </div>
    <div class="profile-section">
      <h1 id="txtNama" class="nama-peserta">-</h1>
      <div id="txtDelegasi" class="delegasi">-</div>
    </div>
    <div class="berkas-section-title">Status Berkas Peserta</div>
    <div class="berkas-grid">
      <div id="cardKK" class="berkas-item"><span class="icon-tempat" id="iconKK"></span>Kartu Keluarga</div>
      <div id="cardPernyataan" class="berkas-item"><span class="icon-tempat" id="iconPernyataan"></span>Surat Pernyataan</div>
      <div id="cardKesediaan" class="berkas-item"><span class="icon-tempat" id="iconKesediaan"></span>Surat Kesediaan</div>
      <div id="cardRekom" class="berkas-item"><span class="icon-tempat" id="iconRekom"></span>S. Rekomendasi</div>
      <div id="cardBiodata" class="berkas-item"><span class="icon-tempat" id="iconBiodata"></span>Biodata Peserta</div>
      <div id="cardEsai" class="berkas-item"><span class="icon-tempat" id="iconEsai"></span>Esai</div>
    </div>
  </div>

  <script>
    const iconCentang = `<svg class="icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>`;
    const iconSilang = `<svg class="icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>`;

    function setBerkasStatus(idCard, idIcon, isSudahAda) {
      const card = document.getElementById(idCard);
      const icon = document.getElementById(idIcon);
      if(isSudahAda) {
        card.className = "berkas-item status-ok";
        icon.innerHTML = iconCentang;
      } else {
        card.className = "berkas-item status-no";
        icon.innerHTML = iconSilang;
      }
    }

    function showError(message) {
      document.getElementById('spinner').style.display = 'none';
      const textEl = document.getElementById('loadingText');
      textEl.className = 'loader-text error-text';
      textEl.innerHTML = message;
    }

    // =========================================================================
    // KONFIGURASI API
    // Ganti URL ini dengan URL Web App Google Apps Script Anda yang baru nanti!
    // =========================================================================
    const GAS_URL = "https://script.google.com/macros/s/AKfycbw1ecAXVHCDQuqlkKOVxVljo6spnbQigQensRgfAahCRc81LEmEVuNly8jS9Pgdo1Jamw/exec";

    window.onload = async () => {
      // 1. Ambil Parameter ID dari URL browser (?id=REG-123)
      const urlParams = new URLSearchParams(window.location.search);
      const idTarget = urlParams.get('id');

      // Jika URL tidak ada id-nya
      if (!idTarget) {
        showError("QR Code Tidak Valid<br><span style='font-size:0.7rem'>ID Peserta tidak ditemukan</span>");
        return;
      }

      try {
        // 2. Kirim permintaan (fetch) ke Google Apps Script
        const response = await fetch(`${GAS_URL}?id=${idTarget}`);
        const result = await response.json();

        // 3. Cek respon dari Google
        if (result.status === "success") {
          const data = result.data;

          // 4. Masukkan data ke HTML
          document.getElementById('txtNoReg').innerText = data.noReg;
          document.getElementById('txtNama').innerText = data.nama;
          document.getElementById('txtDelegasi').innerText = data.delegasi;
          document.getElementById('imgFoto').src = data.fotoUrl;

          setBerkasStatus('cardKK', 'iconKK', data.berkas.kk);
          setBerkasStatus('cardPernyataan', 'iconPernyataan', data.berkas.pernyataan);
          setBerkasStatus('cardKesediaan', 'iconKesediaan', data.berkas.kesediaan);
          setBerkasStatus('cardRekom', 'iconRekom', data.berkas.rekomendasi);
          setBerkasStatus('cardBiodata', 'iconBiodata', data.berkas.biodata);
          setBerkasStatus('cardEsai', 'iconEsai', data.berkas.esai);

          // 5. Hilangkan Loading dan tampilkan Kartu
          const loader = document.getElementById('loader');
          const app = document.getElementById('app');
          loader.style.opacity = '0';
          setTimeout(() => {
            loader.style.display = 'none';
            app.classList.add('show');
          }, 500);

        } else {
          // Jika Data tidak ada di Excel
          showError("Data Tidak Ditemukan<br><span style='font-size:0.7rem'>Peserta dengan ID tersebut tidak terdaftar</span>");
        }

      } catch (error) {
        // Jika server Google error atau koneksi HP putus
        showError("Gagal Menghubungi Server<br><span style='font-size:0.7rem'>Cek koneksi internet Anda</span>");
      }
    };
  </script>
</body>
</html>
